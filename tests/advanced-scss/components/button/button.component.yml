$schema: https://git.drupalcode.org/project/drupal/-/raw/10.3.x/core/assets/schemas/v1/metadata.schema.json
name: Button
status: experimental

props:
  label:
    type: string
    default: 'Button'
    description: "A dummy button for testing purposes"
  variant:
    type: string
    default: "primary"
    description: "The button variant"
    enum:
      - primary
      - secondary
      - success
      - info
      - warning
      - error
      - black
      - light
      - white
